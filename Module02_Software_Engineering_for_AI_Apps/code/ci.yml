# Copy to .github/workflows/ci.yml in your repository.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:                                 # every PR: fast, free, no API key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q .
      - name: Offline unit tests (fake client)
        run: python -m unittest discover -s tests -v

  smoke:                                # after merge to main only
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging                # holds the staging API key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: One live call with the staging key
        run: python 07_sdk_call.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
